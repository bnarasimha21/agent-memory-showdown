# Host ports are configurable so a second stack (for example the test stack,
# `docker compose -p ams-test`, see `make test-integration`) can run alongside.
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-benchmark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benchmark}
      POSTGRES_DB: ${POSTGRES_DB:-memory_bench}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-benchmark}"]
      interval: 5s
      timeout: 5s
      retries: 10

  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-do}
      - DO_API_KEY=${DO_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-anthropic-claude-4.5-sonnet}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-local}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-384}
      - RETRIEVAL_K=${RETRIEVAL_K:-4}
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-benchmark}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-benchmark}
      - POSTGRES_DB=${POSTGRES_DB:-memory_bench}
      - NUM_RUNS=${NUM_RUNS:-5}
      - NUM_TURNS=${NUM_TURNS:-50}
      - FACTS_PER_CATEGORY=${FACTS_PER_CATEGORY:-extraction=3,update=2,temporal=1,multi_hop=1,abstention=2,sensitive=2}
      - DISTRACTORS=${DISTRACTORS:-1}
      - CHECKPOINTS=${CHECKPOINTS:-15,25,35,50}
    volumes:
      - ./results:/app/results

volumes:
  qdrant_data:
  pgvector_data:
