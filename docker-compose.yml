version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-benchmark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benchmark}
      POSTGRES_DB: ${POSTGRES_DB:-memory_bench}
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-benchmark}"]
      interval: 10s
      timeout: 5s
      retries: 5

  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: benchmark
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-benchmark}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-benchmark}
      - POSTGRES_DB=${POSTGRES_DB:-memory_bench}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-3.5-turbo}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - NUM_RUNS=${NUM_RUNS:-10}
      - NUM_TURNS=${NUM_TURNS:-50}
    volumes:
      - ./results:/app/results
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  qdrant_data:
  pgvector_data:
