version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-benchmark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benchmark}
      POSTGRES_DB: ${POSTGRES_DB:-memory_bench}
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-benchmark}"]
      interval: 10s
      timeout: 5s
      retries: 5

  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: benchmark
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - DO_API_KEY=${DO_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-anthropic-claude-4.5-sonnet}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-384}
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-benchmark}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-benchmark}
      - POSTGRES_DB=${POSTGRES_DB:-memory_bench}
      - NUM_RUNS=${NUM_RUNS:-5}
      - NUM_TURNS=${NUM_TURNS:-50}
      - SEED_TURNS=${SEED_TURNS:-1,3,7,12,18,25,30,35,40,45}
      - RECALL_TURNS=${RECALL_TURNS:-15,25,35,50}
    volumes:
      - ./results:/app/results

volumes:
  qdrant_data:
  pgvector_data:
