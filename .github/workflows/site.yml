name: results site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A newer push to the same ref makes an older test run pointless.
    concurrency:
      group: test-${{ github.ref }}-${{ matrix.python }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # benchmarkData.ts is checked by evaluating it with node's built-in type stripping (22.6+).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install (without sentence-transformers; tests and the site use fake embeddings)
        run: |
          grep -v '^sentence-transformers' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -m "not integration"

  build:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (without sentence-transformers; tests and the site use fake embeddings)
        run: |
          grep -v '^sentence-transformers' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt -r requirements-dev.txt
      - name: README block and benchmarkData.ts match the published bundles
        run: python -m src.site.export --check
      - name: Build the site
        run: python -m src.site.build --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Deploys run one at a time and are never cancelled halfway; a queued one waits.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
