<svg viewBox="0 0 1000 868" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Agent Memory Benchmark architecture</title><desc>A fact bank and a dataset generator produce one seeded conversation per run. A harness runs six memory backends through the same conversations with one prompt, probes memory read-only at checkpoints and aborts a run if memory changed. The backends share an answering model, local embeddings, Qdrant and Postgres. Every probe is scored by a deterministic matcher and by a judge from a different model family. A run bundle feeds the aggregate, a generated guide, the README and the results site. The published run of 2026-11-16 is summarised at the bottom.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D9E75"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E24B4A"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F77DD"/></marker></defs><rect x="0" y="0" width="1000" height="868" fill="#FFFFFF"/><text x="30" y="36" font-size="23" fill="#2C2C2A" font-weight="600">Agent Memory Benchmark: Six Backends, One Harness</text><text x="30" y="57" font-size="13.5" fill="#5F5E5A">Same conversations, same model, same prompt. Only what goes into the Memory section differs.</text><text x="30" y="92" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">INPUT</text><rect x="30.0" y="104" width="301.3333333333333" height="70" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><text x="42.0" y="125" font-size="13" fill="#2C2C2A" font-weight="600">Fact bank (YAML)</text><text x="42.0" y="142" font-size="10.5" fill="#5F5E5A">templates with slots, versioned</text><text x="42.0" y="156.5" font-size="10.5" fill="#5F5E5A">and hashed in the manifest</text><rect x="349.3333333333333" y="104" width="301.3333333333333" height="70" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><text x="361.3333333333333" y="125" font-size="13" fill="#2C2C2A" font-weight="600">Dataset generator</text><text x="361.3333333333333" y="142" font-size="10.5" fill="#5F5E5A">one conversation per run seed:</text><text x="361.3333333333333" y="156.5" font-size="10.5" fill="#5F5E5A">facts, corrections, distractors, filler</text><rect x="668.6666666666666" y="104" width="301.3333333333333" height="70" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><text x="680.6666666666666" y="125" font-size="13" fill="#2C2C2A" font-weight="600">Configuration</text><text x="680.6666666666666" y="142" font-size="10.5" fill="#5F5E5A">models, k, checkpoints, runs,</text><text x="680.6666666666666" y="156.5" font-size="10.5" fill="#5F5E5A">a spend ceiling, calls in parallel</text><path d="M331.3333333333333,139 L345.3333333333333,139" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="30" y="206" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">HARNESS</text><rect x="30" y="218" width="940" height="84" rx="9" fill="#EEEDFE" stroke="#7F77DD"/><text x="42" y="239" font-size="13" fill="#3C3489" font-weight="600">Per backend, per run, on the same dataset</text><text x="42" y="256" font-size="10.5" fill="#3C3489">Each turn: retrieve memory, answer, write the exchange back. At each checkpoint: ask every ready fact as a read-only probe,</text><text x="42" y="270.5" font-size="10.5" fill="#3C3489">then compare a fingerprint of the store before and after. If memory changed, the run aborts. A run that fails for one backend</text><text x="42" y="285.0" font-size="10.5" fill="#3C3489">is dropped for all of them. The run stops cleanly when recorded spend reaches the ceiling, and can be resumed.</text><path d="M500.0,174 L500.0,214" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><path d="M819.3333333333333,174 L819.3333333333333,214" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="30" y="334" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">SIX MEMORY BACKENDS</text><rect x="30.0" y="346" width="145.0" height="70" rx="9" fill="#FAF9F5" stroke="#D3D1C7"/><text x="42.0" y="367" font-size="13" fill="#2C2C2A" font-weight="600">buffer</text><text x="42.0" y="384" font-size="10.5" fill="#5F5E5A">full history</text><rect x="189.0" y="346" width="145.0" height="70" rx="9" fill="#FAF9F5" stroke="#D3D1C7"/><text x="201.0" y="367" font-size="13" fill="#2C2C2A" font-weight="600">summary</text><text x="201.0" y="384" font-size="10.5" fill="#5F5E5A">rolling LLM</text><text x="201.0" y="398.5" font-size="10.5" fill="#5F5E5A">summary</text><rect x="348.0" y="346" width="145.0" height="70" rx="9" fill="#FAF9F5" stroke="#D3D1C7"/><text x="360.0" y="367" font-size="13" fill="#2C2C2A" font-weight="600">qdrant</text><text x="360.0" y="384" font-size="10.5" fill="#5F5E5A">top k by</text><text x="360.0" y="398.5" font-size="10.5" fill="#5F5E5A">cosine</text><rect x="507.0" y="346" width="145.0" height="70" rx="9" fill="#FAF9F5" stroke="#D3D1C7"/><text x="519.0" y="367" font-size="13" fill="#2C2C2A" font-weight="600">pgvector</text><text x="519.0" y="384" font-size="10.5" fill="#5F5E5A">top k by</text><text x="519.0" y="398.5" font-size="10.5" fill="#5F5E5A">cosine</text><rect x="666.0" y="346" width="145.0" height="70" rx="9" fill="#FAF9F5" stroke="#D3D1C7"/><text x="678.0" y="367" font-size="13" fill="#2C2C2A" font-weight="600">langgraph_store</text><text x="678.0" y="384" font-size="10.5" fill="#5F5E5A">Postgres store,</text><text x="678.0" y="398.5" font-size="10.5" fill="#5F5E5A">vector index</text><rect x="825.0" y="346" width="145.0" height="70" rx="9" fill="#FAF9F5" stroke="#D3D1C7"/><text x="837.0" y="367" font-size="13" fill="#2C2C2A" font-weight="600">mem0</text><text x="837.0" y="384" font-size="10.5" fill="#5F5E5A">facts an LLM</text><text x="837.0" y="398.5" font-size="10.5" fill="#5F5E5A">extracts</text><path d="M500,302 L500,342" fill="none" stroke="#7F77DD" stroke-width="2" marker-end="url(#ap)"/><text x="30" y="448" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">SHARED SERVICES</text><rect x="30" y="460" width="940" height="66" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><rect x="44.0" y="470" width="294.6666666666667" height="46" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><text x="56.0" y="491" font-size="13" fill="#0F6E56" font-weight="600">Answering model</text><text x="56.0" y="508" font-size="10.5" fill="#0F6E56">Claude Sonnet 5.5, DO Serverless Inference</text><rect x="352.6666666666667" y="470" width="294.6666666666667" height="46" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><text x="364.6666666666667" y="491" font-size="13" fill="#0F6E56" font-weight="600">Embeddings</text><text x="364.6666666666667" y="508" font-size="10.5" fill="#0F6E56">all-MiniLM-L6-v2, local, 384 dimensions</text><rect x="661.3333333333334" y="470" width="294.6666666666667" height="46" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><text x="673.3333333333334" y="491" font-size="13" fill="#0F6E56" font-weight="600">Qdrant and PostgreSQL + pgvector</text><text x="673.3333333333334" y="508" font-size="10.5" fill="#0F6E56">Docker, same host</text><path d="M500,416 L500,456" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><text x="30" y="558" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">SCORING AND OUTPUT</text><rect x="30.0" y="570" width="224.5" height="70" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><text x="42.0" y="591" font-size="13" fill="#2C2C2A" font-weight="600">Run bundle</text><text x="42.0" y="608" font-size="10.5" fill="#5F5E5A">manifest, dataset,</text><text x="42.0" y="622.5" font-size="10.5" fill="#5F5E5A">transcript per probe</text><rect x="268.5" y="570" width="224.5" height="70" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><text x="280.5" y="591" font-size="13" fill="#2C2C2A" font-weight="600">Matcher + separate judge</text><text x="280.5" y="608" font-size="10.5" fill="#5F5E5A">deterministic rules, and GPT-6 Sol,</text><text x="280.5" y="622.5" font-size="10.5" fill="#5F5E5A">a different model family</text><rect x="507.0" y="570" width="224.5" height="70" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><text x="519.0" y="591" font-size="13" fill="#2C2C2A" font-weight="600">Aggregate</text><text x="519.0" y="608" font-size="10.5" fill="#5F5E5A">recall with intervals, cost,</text><text x="519.0" y="622.5" font-size="10.5" fill="#5F5E5A">cost per correct recall</text><rect x="745.5" y="570" width="224.5" height="70" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><text x="757.5" y="591" font-size="13" fill="#2C2C2A" font-weight="600">Guide, README, site</text><text x="757.5" y="608" font-size="10.5" fill="#5F5E5A">all generated from</text><text x="757.5" y="622.5" font-size="10.5" fill="#5F5E5A">the bundle</text><path d="M500,526 L500,566" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><path d="M254.5,605 L264.5,605" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><path d="M493.0,605 L503.0,605" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><path d="M731.5,605 L741.5,605" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="30" y="672" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">PUBLISHED RUN, 2026-11-16: 3 RUNS OF 30 TURNS, K = 4</text><rect x="30" y="684" width="940" height="84" rx="9" fill="#FAF9F5" stroke="#D3D1C7"/><text x="46" y="706" font-size="11.5" fill="#2C2C2A">buffer, summary and mem0: 100% recall. Qdrant, pgvector and the LangGraph store: 87 to 95%. No backend is separated from the best.</text><text x="46" y="724" font-size="11.5" fill="#2C2C2A">Every vector-store miss was a corrected fact: retrieval returned the old and the new statement with nothing to say which came later.</text><text x="46" y="742" font-size="11.5" fill="#2C2C2A">Cost per conversation: vector stores $0.19 to $0.21, buffer $0.39, mem0 $0.96, summary $1.86. The summary did not compress.</text><text x="46" y="760" font-size="11.5" fill="#5F5E5A">Three runs give wide intervals, and at 30 turns the whole buffer fits in context. Latency from this run is not comparable.</text><text x="30" y="790" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">LEGEND</text><rect x="30" y="806" width="16" height="16" rx="4" fill="#EEEDFE" stroke="#7F77DD"/><text x="54" y="818" font-size="11.5" fill="#5F5E5A">Harness</text><rect x="142.1" y="806" width="16" height="16" rx="4" fill="#FAF9F5" stroke="#D3D1C7"/><text x="166.1" y="818" font-size="11.5" fill="#5F5E5A">Memory backend</text><rect x="298.29999999999995" y="806" width="16" height="16" rx="4" fill="#E1F5EE" stroke="#1D9E75"/><text x="322.29999999999995" y="818" font-size="11.5" fill="#5F5E5A">Shared services</text><rect x="460.79999999999995" y="806" width="16" height="16" rx="4" fill="#F1EFE8" stroke="#D3D1C7"/><text x="484.79999999999995" y="818" font-size="11.5" fill="#5F5E5A">Data and results</text><text x="30" y="846" font-size="11" fill="#5F5E5A">Headline recall leaves out abstention and sensitive facts, which are reported on their own. The earlier v1 run used a different method and is not comparable.</text></svg>
