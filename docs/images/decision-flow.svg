<svg viewBox="0 0 1000 1036" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Agent Memory Benchmark decision flow</title><desc>One benchmark run in eight steps: generate the dataset, check before paying, run the conversation, probe memory read-only at checkpoints, score every probe twice, aggregate over paired seeds, publish, and show it on the results site. Six of the steps have an exit where a run is refused, aborted, dropped, or marked, and every step writes to the run bundle.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D9E75"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E24B4A"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F77DD"/></marker></defs><rect x="0" y="0" width="1000" height="1036" fill="#FFFFFF"/><text x="30" y="36" font-size="23" fill="#2C2C2A" font-weight="600">Agent Memory Benchmark: One Run, Every Check</text><text x="30" y="57" font-size="13.5" fill="#5F5E5A">Each step either keeps a number honest or stops it. A run that cannot be trusted is dropped, not averaged in.</text><text x="30" y="92" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">ONE RUN THROUGH THE HARNESS</text><text x="610" y="92" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">WHERE A NUMBER IS STOPPED OR MARKED</text><rect x="30" y="108" width="500" height="70" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><circle cx="54" cy="132" r="12" fill="#FFFFFF" stroke="#D3D1C7"/><text x="54" y="136" font-size="12" fill="#2C2C2A" font-weight="600" text-anchor="middle">1</text><text x="76" y="136" font-size="14" fill="#2C2C2A" font-weight="600">Generate one conversation per seed</text><text x="76" y="154" font-size="11" fill="#5F5E5A">facts sampled from data/facts_v2.yaml; no two facts share a value;</text><text x="76" y="169" font-size="11" fill="#5F5E5A">the same seed gives the same conversation, saved as dataset.json</text><path d="M280,178 L280,201" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><path d="M530,143.0 L606,143.0" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="112.0" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="622" y="135.0" font-size="13" fill="#A32D2D" font-weight="600">No headline probe in this configuration</text><text x="622" y="152.0" font-size="11" fill="#A32D2D">refused: there would be no recall to report</text><rect x="30" y="204" width="500" height="70" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><circle cx="54" cy="228" r="12" fill="#FFFFFF" stroke="#1D9E75"/><text x="54" y="232" font-size="12" fill="#0F6E56" font-weight="600" text-anchor="middle">2</text><text x="76" y="232" font-size="14" fill="#0F6E56" font-weight="600">Check before anything is paid for</text><text x="76" y="250" font-size="11" fill="#0F6E56">at least one headline probe exists, the embedding model loads,</text><text x="76" y="265" font-size="11" fill="#0F6E56">the judge resolves, a resume matches the manifest</text><path d="M280,274 L280,297" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><path d="M530,239.0 L606,239.0" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="208.0" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="622" y="231.0" font-size="13" fill="#A32D2D" font-weight="600">Embedding model, judge or resume does not check</text><text x="622" y="248.0" font-size="11" fill="#A32D2D">stopped before the first paid call</text><rect x="30" y="300" width="500" height="70" rx="9" fill="#EEEDFE" stroke="#7F77DD"/><circle cx="54" cy="324" r="12" fill="#FFFFFF" stroke="#7F77DD"/><text x="54" y="328" font-size="12" fill="#3C3489" font-weight="600" text-anchor="middle">3</text><text x="76" y="328" font-size="14" fill="#3C3489" font-weight="600">Conversation turns, one backend at a time</text><text x="76" y="346" font-size="11" fill="#3C3489">retrieve, answer with the one shared prompt, write the exchange;</text><text x="76" y="361" font-size="11" fill="#3C3489">tokens and time recorded per component, retry waits kept apart</text><path d="M280,370 L280,393" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><path d="M530,335.0 L606,335.0" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="304.0" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="622" y="327.0" font-size="13" fill="#A32D2D" font-weight="600">A backend fails during the run</text><text x="622" y="344.0" font-size="11" fill="#A32D2D">error recorded in run_end; that seed is later</text><text x="622" y="359.0" font-size="11" fill="#A32D2D">dropped for every backend</text><rect x="30" y="396" width="500" height="70" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><circle cx="54" cy="420" r="12" fill="#FFFFFF" stroke="#1D9E75"/><text x="54" y="424" font-size="12" fill="#0F6E56" font-weight="600" text-anchor="middle">4</text><text x="76" y="424" font-size="14" fill="#0F6E56" font-weight="600">Checkpoint: probe memory, read-only</text><text x="76" y="442" font-size="11" fill="#0F6E56">fingerprint the store, ask every fact that is ready, write nothing,</text><text x="76" y="457" font-size="11" fill="#0F6E56">fingerprint again; the two must match</text><path d="M280,466 L280,489" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><path d="M530,431.0 L606,431.0" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="400.0" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="622" y="423.0" font-size="13" fill="#A32D2D" font-weight="600">Memory changed while probing</text><text x="622" y="440.0" font-size="11" fill="#A32D2D">ProbeIsolationError: the run is aborted</text><rect x="30" y="492" width="500" height="70" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><circle cx="54" cy="516" r="12" fill="#FFFFFF" stroke="#1D9E75"/><text x="54" y="520" font-size="12" fill="#0F6E56" font-weight="600" text-anchor="middle">5</text><text x="76" y="520" font-size="14" fill="#0F6E56" font-weight="600">Score every probe twice</text><text x="76" y="538" font-size="11" fill="#0F6E56">deterministic matcher, then an LLM judge on a fixed rubric;</text><text x="76" y="553" font-size="11" fill="#0F6E56">the judge never sees which backend answered</text><path d="M280,562 L280,585" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><path d="M530,527.0 L606,527.0" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="496.0" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="622" y="519.0" font-size="13" fill="#A32D2D" font-weight="600">Judge reply cannot be parsed</text><text x="622" y="536.0" font-size="11" fill="#A32D2D">the matcher label stands; every disagreement</text><text x="622" y="551.0" font-size="11" fill="#A32D2D">and Cohen&#x27;s kappa go to aggregate.json</text><rect x="30" y="588" width="500" height="70" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><circle cx="54" cy="612" r="12" fill="#FFFFFF" stroke="#1D9E75"/><text x="54" y="616" font-size="12" fill="#0F6E56" font-weight="600" text-anchor="middle">6</text><text x="76" y="616" font-size="14" fill="#0F6E56" font-weight="600">Aggregate over paired seeds</text><text x="76" y="634" font-size="11" fill="#0F6E56">headline recall leaves out abstention and sensitive facts;</text><text x="76" y="649" font-size="11" fill="#0F6E56">t interval over runs; cost from pricing.yaml token prices</text><path d="M280,658 L280,681" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><rect x="30" y="684" width="500" height="70" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><circle cx="54" cy="708" r="12" fill="#FFFFFF" stroke="#D3D1C7"/><text x="54" y="712" font-size="12" fill="#2C2C2A" font-weight="600" text-anchor="middle">7</text><text x="76" y="712" font-size="14" fill="#2C2C2A" font-weight="600">Publish the bundle</text><text x="76" y="730" font-size="11" fill="#5F5E5A">publish.py updates latest.json, the README block and the video data;</text><text x="76" y="745" font-size="11" fill="#5F5E5A">CI tests, checks the README against the bundles, builds the site</text><path d="M280,754 L280,777" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><path d="M530,719.0 L606,719.0" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="688.0" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="622" y="711.0" font-size="13" fill="#A32D2D" font-weight="600">A fake model took part, or the README drifted</text><text x="622" y="728.0" font-size="11" fill="#A32D2D">marked a sample, never the headline over a real</text><text x="622" y="743.0" font-size="11" fill="#A32D2D">run; a stale README block fails CI</text><rect x="30" y="780" width="500" height="70" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><circle cx="54" cy="804" r="12" fill="#FFFFFF" stroke="#D3D1C7"/><text x="54" y="808" font-size="12" fill="#2C2C2A" font-weight="600" text-anchor="middle">8</text><text x="76" y="808" font-size="14" fill="#2C2C2A" font-weight="600">Results site</text><text x="76" y="826" font-size="11" fill="#5F5E5A">static page on GitHub Pages; every number links to its bundle</text><text x="76" y="841" font-size="11" fill="#5F5E5A">and each backend has a page with every probe&#x27;s transcript</text><path d="M470,396 L470,373" fill="none" stroke="#1D9E75" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#at)"/><text x="478" y="387" font-size="10.5" fill="#5F5E5A">next turn</text><text x="288" y="387" font-size="10.5" fill="#5F5E5A">checkpoint turn</text><text x="30" y="872" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">EVERY STEP WRITES TO THE RUN BUNDLE</text><rect x="30" y="888" width="940" height="50" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><text x="500" y="909" font-size="13" fill="#2C2C2A" font-weight="600" text-anchor="middle">manifest, dataset, transcript (one line per turn and probe), scores and aggregate in results/runs/&lt;run_id&gt;/</text><text x="500" y="927" font-size="11" fill="#5F5E5A" text-anchor="middle">git sha, models, seeds, prompt and judge hashes recorded; re-scoring reads the transcript and never reruns the conversation</text><text x="30" y="960" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">LEGEND</text><rect x="30" y="976" width="16" height="16" rx="4" fill="#E1F5EE" stroke="#1D9E75"/><text x="54" y="988" font-size="11.5" fill="#5F5E5A">Harness checks here</text><rect x="217.7" y="976" width="16" height="16" rx="4" fill="#EEEDFE" stroke="#7F77DD"/><text x="241.7" y="988" font-size="11.5" fill="#5F5E5A">Calls the answering model</text><rect x="443.2" y="976" width="16" height="16" rx="4" fill="#FCEBEB" stroke="#E24B4A"/><text x="467.2" y="988" font-size="11.5" fill="#5F5E5A">Stopped, dropped or marked</text><text x="30" y="1018" font-size="11" fill="#5F5E5A">Reading and writing memory takes 13 to 19 ms per turn at p50 for the vector backends, most of it the embedding model; under 0.02 ms for the buffer.</text></svg>
