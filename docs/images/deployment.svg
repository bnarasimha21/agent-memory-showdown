<svg viewBox="0 0 1000 880" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Agent Memory Benchmark deployment today</title><desc>Two halves, neither a long-running service. A benchmark run is one machine running docker compose: the benchmark container with the harness and local embeddings, Qdrant and Postgres with pgvector, and the results folder, calling a model provider outside the machine one call at a time. Publishing has no server: a committed run bundle goes to GitHub, Actions tests it and builds a static site, and GitHub Pages serves it. Boundaries are drawn as dashed lines.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D9E75"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E24B4A"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F77DD"/></marker></defs><rect x="0" y="0" width="1000" height="880" fill="#FFFFFF"/><text x="30" y="36" font-size="23" fill="#2C2C2A" font-weight="600">Agent Memory Benchmark: Where It Runs Today</text><text x="30" y="57" font-size="13.5" fill="#5F5E5A">A batch job on one machine, then a static site. No service stays up. Dashed lines are boundaries.</text><text x="30" y="92" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">A. A BENCHMARK RUN: ONE MACHINE, DOCKER COMPOSE</text><rect x="30" y="104" width="680" height="330" rx="12" fill="#FFFFFF" stroke="#888780" stroke-width="1.5" stroke-dasharray="7 5"/><text x="46" y="126" font-size="11.5" fill="#2C2C2A" font-weight="600">Boundary: the run machine</text><text x="46" y="141" font-size="10.5" fill="#5F5E5A">a Droplet (8 GB, 4 vCPU) or a laptop</text><rect x="46" y="160" width="220" height="98" rx="9" fill="#EEEDFE" stroke="#7F77DD"/><text x="58" y="181" font-size="13" fill="#3C3489" font-weight="600">benchmark container</text><text x="58" y="198" font-size="10.5" fill="#3C3489">run_benchmark.py: harness, six</text><text x="58" y="212.5" font-size="10.5" fill="#3C3489">backends, matcher, judge client;</text><text x="58" y="227.0" font-size="10.5" fill="#3C3489">all-MiniLM-L6-v2 embeddings on CPU;</text><text x="58" y="241.5" font-size="10.5" fill="#3C3489">one model call at a time</text><rect x="346" y="160" width="160" height="84" rx="9" fill="#FAF9F5" stroke="#D3D1C7"/><text x="358" y="181" font-size="13" fill="#2C2C2A" font-weight="600">Qdrant 1.20</text><text x="358" y="198" font-size="10.5" fill="#5F5E5A">qdrant and mem0</text><text x="358" y="212.5" font-size="10.5" fill="#5F5E5A">collections, one per</text><text x="358" y="227.0" font-size="10.5" fill="#5F5E5A">session; local volume</text><rect x="530" y="160" width="164" height="84" rx="9" fill="#FAF9F5" stroke="#D3D1C7"/><text x="542" y="181" font-size="13" fill="#2C2C2A" font-weight="600">Postgres 16 + pgvector</text><text x="542" y="198" font-size="10.5" fill="#5F5E5A">pgvector rows and the</text><text x="542" y="212.5" font-size="10.5" fill="#5F5E5A">LangGraph store;</text><text x="542" y="227.0" font-size="10.5" fill="#5F5E5A">local volume</text><path d="M266,195 L342,195" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="279" y="188" font-size="10.5" fill="#5F5E5A">HTTP</text><path d="M266,240 L320,240 L320,264 L612,264 L612,248" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="330" y="280" font-size="10.5" fill="#5F5E5A">psycopg 3, password from the environment</text><rect x="46" y="300" width="160" height="64" rx="9" fill="#FAF9F5" stroke="#D3D1C7"/><text x="58" y="321" font-size="13" fill="#2C2C2A" font-weight="600">.env</text><text x="58" y="338" font-size="10.5" fill="#5F5E5A">DO_API_KEY, model ids,</text><text x="58" y="352.5" font-size="10.5" fill="#5F5E5A">run settings</text><path d="M126,300 L126,262" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><rect x="346" y="300" width="348" height="64" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><text x="358" y="321" font-size="13" fill="#0F6E56" font-weight="600">results/ (bind mount)</text><text x="358" y="338" font-size="10.5" fill="#0F6E56">run bundle, written line by line as the run goes;</text><text x="358" y="352.5" font-size="10.5" fill="#0F6E56">a killed run is resumed from it with --resume</text><path d="M226,258 L226,282 L300,282 L300,332 L342,332" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="46" y="392" font-size="10.5" fill="#A32D2D">Host ports 6333 and 5432 are published and the Postgres password defaults to &quot;benchmark&quot;. Qdrant has no</text><text x="46" y="407" font-size="10.5" fill="#A32D2D">API key. On a public Droplet both are open unless a firewall closes them. All stored data is synthetic.</text><rect x="750" y="104" width="220" height="330" rx="12" fill="#FFFFFF" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="7 5"/><text x="766" y="126" font-size="11.5" fill="#A32D2D" font-weight="600">Outside the machine</text><text x="766" y="141" font-size="10.5" fill="#A32D2D">paid per token</text><rect x="766" y="160" width="188" height="112" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="778" y="181" font-size="13" fill="#A32D2D" font-weight="600">Model provider</text><text x="778" y="198" font-size="10.5" fill="#A32D2D">DO Serverless Inference,</text><text x="778" y="212.5" font-size="10.5" fill="#A32D2D">Claude Sonnet 4.5, HTTPS,</text><text x="778" y="227.0" font-size="10.5" fill="#A32D2D">key from the environment;</text><text x="778" y="241.5" font-size="10.5" fill="#A32D2D">answers, summary, mem0</text><text x="778" y="256.0" font-size="10.5" fill="#A32D2D">extraction and the judge</text><rect x="766" y="300" width="188" height="84" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="778" y="321" font-size="13" fill="#A32D2D" font-weight="600">or the claude CLI</text><text x="778" y="338" font-size="10.5" fill="#A32D2D">one process per call on a</text><text x="778" y="352.5" font-size="10.5" fill="#A32D2D">Claude subscription; costs</text><text x="778" y="367.0" font-size="10.5" fill="#A32D2D">are API-equivalent</text><path d="M266,175 L296,175 L296,146 L730,146 L730,216 L762,216" fill="none" stroke="#7F77DD" stroke-width="2" marker-end="url(#ap)"/><text x="560" y="140" font-size="10.5" fill="#5F5E5A">HTTPS, every model call</text><text x="30" y="470" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">B. PUBLISHING: NO SERVER</text><rect x="30" y="500" width="190" height="84" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><text x="42" y="521" font-size="13" fill="#2C2C2A" font-weight="600">Operator</text><text x="42" y="538" font-size="10.5" fill="#5F5E5A">publish.py on a finished</text><text x="42" y="552.5" font-size="10.5" fill="#5F5E5A">bundle, then git push of the</text><text x="42" y="567.0" font-size="10.5" fill="#5F5E5A">bundle and generated files</text><rect x="330" y="486" width="400" height="270" rx="12" fill="#FFFFFF" stroke="#888780" stroke-width="1.5" stroke-dasharray="7 5"/><text x="346" y="508" font-size="11.5" fill="#2C2C2A" font-weight="600">Boundary: GitHub</text><text x="346" y="523" font-size="10.5" fill="#5F5E5A">no API key and no model call anywhere in here</text><rect x="346" y="528" width="368" height="56" rx="9" fill="#FAF9F5" stroke="#D3D1C7"/><text x="358" y="549" font-size="13" fill="#2C2C2A" font-weight="600">Repository</text><text x="358" y="566" font-size="10.5" fill="#5F5E5A">committed bundles in results/runs/, latest.json, README block</text><rect x="346" y="604" width="368" height="70" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><text x="358" y="625" font-size="13" fill="#0F6E56" font-weight="600">Actions: results site workflow</text><text x="358" y="642" font-size="10.5" fill="#0F6E56">unit tests on Python 3.11 and 3.12 with fake models;</text><text x="358" y="656.5" font-size="10.5" fill="#0F6E56">README block checked against the bundles; site built</text><rect x="346" y="694" width="368" height="50" rx="9" fill="#FAF9F5" stroke="#D3D1C7"/><text x="358" y="715" font-size="13" fill="#2C2C2A" font-weight="600">GitHub Pages</text><text x="358" y="732" font-size="10.5" fill="#5F5E5A">static results site, deployed from main only</text><path d="M220,542 L342,556" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="244" y="538" font-size="10.5" fill="#5F5E5A">git push</text><path d="M530,584 L530,600" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><path d="M530,674 L530,690" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><rect x="790" y="694" width="180" height="50" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><text x="802" y="715" font-size="13" fill="#2C2C2A" font-weight="600">Reader&#x27;s browser</text><text x="802" y="732" font-size="10.5" fill="#5F5E5A">charts, bundles, transcripts</text><path d="M786,719 L718,719" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="30" y="620" font-size="10.5" fill="#A32D2D">A published number can only come</text><text x="30" y="635" font-size="10.5" fill="#A32D2D">from a committed bundle: the site has</text><text x="30" y="650" font-size="10.5" fill="#A32D2D">no other input, and CI fails if the</text><text x="30" y="665" font-size="10.5" fill="#A32D2D">README disagrees with the bundles.</text><text x="30" y="790" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">LEGEND</text><rect x="30" y="806" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#888780" stroke-dasharray="3 2"/><text x="54" y="818" font-size="11.5" fill="#5F5E5A">Boundary</text><rect x="148.4" y="806" width="16" height="16" rx="4" fill="#EEEDFE" stroke="#7F77DD"/><text x="172.4" y="818" font-size="11.5" fill="#5F5E5A">Calls the model</text><rect x="310.9" y="806" width="16" height="16" rx="4" fill="#E1F5EE" stroke="#1D9E75"/><text x="334.9" y="818" font-size="11.5" fill="#5F5E5A">Results and checks</text><rect x="492.29999999999995" y="806" width="16" height="16" rx="4" fill="#FCEBEB" stroke="#E24B4A"/><text x="516.3" y="818" font-size="11.5" fill="#5F5E5A">Outside, paid per token</text><text x="30" y="858" font-size="11" fill="#5F5E5A">What this shows: one process, one machine, one call at a time, each backend deletes its session data at teardown. Section 8 covers a shared, continuous version.</text></svg>
